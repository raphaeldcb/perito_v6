    <title>Perito System v6.0</title>
    <script>
      // migração única: quem tinha "escuro" do teste antigo passa para o claro (mockup)
      if (!localStorage.getItem('tema_v2')) { localStorage.setItem('theme', 'light'); localStorage.setItem('tema_v2', '1') }
      if (localStorage.getItem('theme') !== 'dark') document.documentElement.classList.add('light')

      // Force clear Service Worker cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(reg => reg.unregister())
        })
        caches.keys().then(names => {
          names.forEach(name => caches.delete(name))
        })
      }
    </script>
