networks:
  perito-network:
    driver: bridge
services:
  perito-db:
    container_name: perito-db
    environment:
      POSTGRES_DB: perito_v6
      POSTGRES_PASSWORD: perito_pass
      POSTGRES_USER: perito
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U perito
      timeout: 5s
    image: postgres:16-alpine
    networks:
    - perito-network
    ports:
    - 5432:5432
    volumes:
    - perito-db-data:/var/lib/postgresql/data
  perito-v6-backend:
    container_name: perito-v6-backend
    depends_on:
      perito-db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_ECHO: 'False'
      DATABASE_URL: postgresql://perito:perito_pass@perito-db:5432/perito_v6
      ENVIRONMENT: production
      SECRET_KEY: a-super-secure-key-change-in-production-12345
      OLLAMA_URL: http://172.17.0.1:11434
      OLLAMA_MODEL: perito-qwen
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      perito-network: null
    extra_hosts:
    - host.docker.internal:127.0.0.1
    ports:
    - 8000:8000
    restart: unless-stopped
    volumes:
    - /var/www/perito-v6/backend:/app
version: '3.8'
volumes:
  perito-db-data: null
